<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJABULO JB Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            margin: 0 auto 20px;
            background: url('https://raw.githubusercontent.com/NjabuloJf/njabulo-data/main/njabuloimg/njabuloimg.png') center/cover;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            display: inline-block;
            background: #00d4ff;
            color: #000;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(0.95); }
        }
        .info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info span {
            color: #00d4ff;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar"></div>
        <h1>NJABULO JB</h1>
        <div class="status">🟢 Bot Connected</div>
        
        <div class="info">
            <strong>🤖 Status:</strong> <span>Active & Online</span><br>
            <strong>📡 Uptime:</strong> <span id="uptime">Loading...</span><br>
            <strong>📅 Started:</strong> <span id="startTime">Loading...</span>
        </div>

        <div class="footer">
            Powered by <a href="https://github.com/NjabuloJf/fana-md" target="_blank">NjabuloJf</a> 🚀
        </div>
    </div>

    <script>
        // Calculate start time
        const startTime = new Date();
        document.getElementById('startTime').innerText = startTime.toLocaleString();

        // Update uptime every second
        function updateUptime() {
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);
            const hours = String(Math.floor(diff / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
            const seconds = String(diff % 60).padStart(2, '0');
            document.getElementById('uptime').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateUptime, 1000);
        updateUptime();
    </script>
</body>
      </html>
